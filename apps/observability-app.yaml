apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
  # finalizers:
  # - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    path: observability
    repoURL: git@github.com:LGSTR-UNAL/hydraflowsim-k8s.git
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: hydraflowsim
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
