---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: sim-server
  name: sim-server
  namespace: hydraflowsim
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: sim-server
  template:
    metadata:
      labels:
        app: sim-server
    spec:
      containers:
        - name: sim-server
          # Build and push the server image from your software source, then replace this placeholder.
          image: registry.example.com/your-project/sim-server:1.0.0
          imagePullPolicy: Always
          ports:
            - name: yk-port
              containerPort: 8000
              protocol: TCP
          workingDir: /opt/server
          command: ["uvicorn"]
          args:
            [
              "main:app",
              "--host",
              "0.0.0.0",
              "--port",
              "8000",
              "--workers",
              "1",
            ]
          env:
            - name: ALL_REQUEST_TOPIC
              value: "hydraflowsim.streaming.all-simulations"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-kafka-bootstrap.hydraflowsim.svc.cluster.local:9092"
            - name: REQUEST_TOPIC
              value: "hydraflowsim.streaming.simulations"
            - name: S3_ENDPOINT_URL
              value: "http://rustfs.hydraflowsim.svc.cluster.local:9000/"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: RUSTFS_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: RUSTFS_SECRET_KEY
            - name: DB_HOST
              value: "postgres-pooler.hydraflowsim.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "app"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: password
      imagePullSecrets:
        - name: reg-cred
