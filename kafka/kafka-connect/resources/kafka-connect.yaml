apiVersion: kafka.strimzi.io/v1
kind: KafkaConnect
metadata:
  name: kafka-connect
  annotations:
    strimzi.io/use-connector-resources: "true"
spec:
  image: lgstrunal/kafka-connect:4.2.0-jdbc10.9.4
  version: 4.2.0
  replicas: 2
  bootstrapServers: kafka-kafka-bootstrap.yaluk.svc.cluster.local:9092
  groupId: connect-cluster
  configStorageTopic: connect-cluster-configs
  offsetStorageTopic: connect-cluster-offsets
  statusStorageTopic: connect-cluster-status
  config:
    config.providers: file
    config.providers.file.class: org.apache.kafka.common.config.provider.FileConfigProvider
    auto.create.topics.enable: "true"
    config.storage.replication.factor: -1
    offset.storage.replication.factor: -1
    status.storage.replication.factor: -1
    connector.client.config.override.policy: All 
  template:
    pod:
      volumes:
        - name: confluent-jdbc-sink-connector-config
          secret:
            secretName: postgres-credentials
    connectContainer:
      volumeMounts:
        - name: confluent-jdbc-sink-connector-config
          mountPath: /mnt/confluent-jdbc-sink-connector-config
