apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-resources
  namespace: argocd
  # finalizers:
  # - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    path: kafka/resources
    repoURL: git@github.com:LGSTR-UNAL/yaluk-k8s-ops.git
    targetRevision: dev
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: yaluk
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
