---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: yaluk-server
  name: yaluk-server
  namespace: yaluk
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: yaluk-server
  template:
    metadata:
      labels:
        app: yaluk-server
    spec:
      containers:
        - name: yaluk-server
          image: lgstrunal/yaluk-server:beta
          imagePullPolicy: Always
          ports:
            - name: yk-port
              containerPort: 8000
              protocol: TCP
          workingDir: /opt/server
          command: ["uvicorn"]
          args:
            [
              "main:app",
              "--host",
              "0.0.0.0",
              "--port",
              "8000",
              "--workers",
              "1",
            ]
          env:
            - name: SOLVER_PATH
              value: "/opt/yaluk/libatp/tpbig"
            - name: ALL_REQUEST_TOPIC
              value: "yaluk.streaming.all-simulations"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-kafka-bootstrap.yaluk.svc.cluster.local:9092"
            - name: REQUEST_TOPIC
              value: "yaluk.streaming.simulations"
            - name: S3_ENDPOINT_URL
              value: "http://minio.yaluk.svc.cluster.local:9000/"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio
                  key: rootUser
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio
                  key: rootPassword
            - name: DB_HOST
              value: "postgres-pooler.yaluk.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "app"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: password
      imagePullSecrets:
        - name: reg-cred
