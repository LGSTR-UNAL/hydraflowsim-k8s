apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi-kafka-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://strimzi.io/charts/"
    targetRevision: 0.43.0
    chart: strimzi-kafka-operator
  destination:
    server: "https://kubernetes.default.svc"
    namespace: yaluk
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
