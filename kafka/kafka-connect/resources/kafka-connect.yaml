apiVersion: kafka.strimzi.io/v1
kind: KafkaConnect
metadata:
  name: kafka-connect
  annotations:
    strimzi.io/use-connector-resources: "true"
spec:
  image: quay.io/strimzi/kafka:1.1.0-kafka-4.2.0
  version: 4.2.0
  replicas: 2
  bootstrapServers: kafka-kafka-bootstrap.yaluk.svc.cluster.local:9092
  groupId: connect-cluster
  configStorageTopic: connect-cluster-configs
  offsetStorageTopic: connect-cluster-offsets
  statusStorageTopic: connect-cluster-status
  build:
    output:
      type: docker
      image: lgstrunal/kafka-connect:4.2.0
      name: kafka-connect
      pushSecret:
        name: reg-cred
    plugins:
      - name: jdbc-connector
        artifacts:
          - type: zip
            url: https://d2p6pa21dvn84.cloudfront.net/api/plugins/confluentinc/kafka-connect-jdbc/versions/10.9.4/confluentinc-kafka-connect-jdbc-10.9.4.zip
      - name: postgresql-driver
        artifacts:
          - type: jar
            url: https://jdbc.postgresql.org/download/postgresql-42.7.12.jar
  config:
    config.providers: env
    config.providers.env.class: org.apache.kafka.common.config.provider.EnvVarConfigProvider
    auto.create.topics.enable: "true"
    config.storage.replication.factor: -1
    offset.storage.replication.factor: -1
    status.storage.replication.factor: -1
    connector.client.config.override.policy: All
  template:
    pod:
      volumes:
        - name: confluent-jdbc-sink-connector-config
          secret:
            secretName: postgres-credentials
    connectContainer:
      env:
        - name: PG_USER
          valueFrom:
            secretKeyRef:
              name: postgres-app
              key: user
        - name: PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-app
              key: password
