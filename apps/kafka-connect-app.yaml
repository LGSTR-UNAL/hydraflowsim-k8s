apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-connect
  namespace: argocd
  # finalizers:
  # - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    path: kafka/kafka-connect
    repoURL: git@github.com:LGSTR-UNAL/hydraflowsim-k8s.git
    targetRevision: main
    directory:
      recurse: true
      exclude: "**/Dockerfile"
  destination:
    server: https://kubernetes.default.svc
    namespace: hydraflowsim
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
