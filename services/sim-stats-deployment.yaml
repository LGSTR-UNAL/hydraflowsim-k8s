---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: sim-stats
  name: sim-stats
  namespace: hydraflowsim
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: sim-stats
  template:
    metadata:
      labels:
        app: sim-stats
    spec:
      containers:
        - name: sim-stats
          # Build and push the statistics service image from your software source, then replace this placeholder.
          image: registry.example.com/your-project/sim-stats:1.0.0
          imagePullPolicy: Always
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: password
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: password
          envFrom:
            - configMapRef:
                name: hydraflowsim-runtime-config
      imagePullSecrets:
        - name: reg-cred
