apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.min.io
    targetRevision: 5.4.0
    helm:
      parameters:
        - name: persistence.size
          value: 50Gi
        - name: replicas
          value: "2"
        - name: service.type
          value: NodePort
        - name: consoleService.type
          value: NodePort
        - name: rootUser
          value: console
        - name: rootPassword
          value: console123
    chart: minio
  destination:
    server: https://kubernetes.default.svc
    namespace: yaluk
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
