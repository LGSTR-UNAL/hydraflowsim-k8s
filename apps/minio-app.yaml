apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.min.io
    targetRevision: 5.4.0
    helm:
      parameters:
        - name: persistence.size
          value: 50Gi
        - name: replicas
          value: "2"
        - name: service.type
          value: NodePort
        - name: consoleService.type
          value: NodePort
        - name: buckets
          value: "{yaluk-requests,yaluk-resources,yaluk-results}"
    chart: minio
  destination:
    server: https://kubernetes.default.svc
    namespace: yaluk
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
