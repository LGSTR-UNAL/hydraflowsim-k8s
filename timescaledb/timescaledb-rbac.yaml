---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: yaluk
  name: timescale-patch
rules:
- apiGroups: [""] # "" indicates the core API group
  resources: ["services"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: timescale-patch-binding
  namespace: yaluk
subjects:
- kind: ServiceAccount
  name: timescaledb
  namespace: yaluk
roleRef:
  kind: Role 
  name: timescale-patch
  apiGroup: rbac.authorization.k8s.io
