---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnector
metadata:
  name: confluent-jdbc-postgres-sink-connector-linet
  labels:
    strimzi.io/cluster: kafka-connect
spec:
  class: io.confluent.connect.jdbc.JdbcSinkConnector
  tasksMax: 2
  autoRestart:
    enabled: true
  config:
    topics: yaluk.streaming.simulation-results
    table.name.format: ${topic}
    value.converter: org.apache.kafka.connect.json.JsonConverter
    auto.create: "true"
    auto.evolve: "true"
    connection.url: "jdbc:postgresql://timescaledb.databases.svc.cluster.local:5432/yaluk"
    connection.user: "${file:/opt/kafka/external-configuration/confluent-jdbc-sink-connector-config/connector.properties:username}"
    connection.password: "${file:/opt/kafka/external-configuration/confluent-jdbc-sink-connector-config/connector.properties:password}"
    transforms: timestamp
    transforms.timestamp.type: org.apache.kafka.connect.transforms.TimestampConverter$Value
    transforms.timestamp.target.type: Timestamp
    transforms.timestamp.field: fecha
    transforms.timestamp.format: yyyy-MM-dd HH:mm:ss.SSS
