apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: kafka
spec:
  kafka:
    version: 3.7.0
    replicas: 2
    resources:
      requests:
        memory: 3Gi
        cpu: "150m"
      limits:
        memory: 4Gi
        cpu: "1"
    storage:
      type: persistent-claim
      size: 1Gi
    readinessProbe:
      initialDelaySeconds: 15
      timeoutSeconds: 5
    livenessProbe:
      initialDelaySeconds: 30
      timeoutSeconds: 5
    jvmOptions:
      -Xms: 3072m
      -Xmx: 3072m
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: external
        port: 9094
        type: nodeport
        tls: false
    config:
      offsets.topic.replication.factor: 2
      transaction.state.log.replication.factor: 2
      transaction.state.log.min.isr: 2
      default.replication.factor: 2
      min.insync.replicas: 2
      inter.broker.protocol.version: "3.5"
  zookeeper:
    replicas: 3
    storage:
      type: persistent-claim
      size: 1Gi
      deleteClaim: false
    config:
      ssl.hostnameVerification: false
      ssl.quorum.hostnameVerification: false
  entityOperator:
    topicOperator: {}
    userOperator: {}
