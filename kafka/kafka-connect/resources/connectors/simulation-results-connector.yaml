---
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: simulation-results-connector
  labels:
    strimzi.io/cluster: kafka-connect
spec:
  class: io.confluent.connect.jdbc.JdbcSinkConnector
  tasksMax: 2
  autoRestart:
    enabled: true
  config:
    topics: hydraflowsim.streaming.simulation-results
    table.name.format: "${env:CONNECT_TABLE_SIMULATION_RESULTS}"
    value.converter: org.apache.kafka.connect.json.JsonConverter
    auto.create: "true"
    auto.evolve: "true"
    insert.mode: "upsert"
    pk.mode: "record_value"
    pk.fields: "simulation_id,measurement"
    connection.url: "jdbc:postgresql://postgres-pooler.hydraflowsim.svc.cluster.local:5432/app"
    connection.user: "${env:PG_USER}"
    connection.password: "${env:PG_PASSWORD}"
    batch.size: 300
    consumer.override.fetch.max.wait.ms: "10000"
    consumer.override.fetch.min.bytes: "1048576"
