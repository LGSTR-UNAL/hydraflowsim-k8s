---
apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/name: test-producer
  name: test-producer
  namespace: yaluk
spec:
  template:
    metadata:
      labels:
        name: test-producer
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: regcred
      containers:
        - name: test-producer
          imagePullPolicy: Always
          image: lgstrunal/test-producer:keraunos
          command: ["/bin/sh"]
          args:
            - -c
            - >-
               python3 /opt/test-producer/main.pyc 
               --file /opt/test-producer/data/LN138_2.csv 
               --circuit LN138_2
          env:
            - name: KAFKA_HOST
              value: "kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"
            - name: REQUEST_TOPIC
              value: "yaluk.streaming.simulations"
