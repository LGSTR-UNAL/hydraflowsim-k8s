apiVersion: v1
kind: Namespace
metadata:
  name: yaluk
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rustfs-secret-generator
  namespace: yaluk
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rustfs-secret-generator
  namespace: yaluk
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["rustfs-credentials"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rustfs-secret-generator
  namespace: yaluk
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
subjects:
  - kind: ServiceAccount
    name: rustfs-secret-generator
    namespace: yaluk
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rustfs-secret-generator
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rustfs-secret-generator
  namespace: yaluk
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  generate-secret.py: |
    import base64
    import json
    import os
    import secrets
    import ssl
    import time
    from urllib.error import HTTPError, URLError
    from urllib.request import Request, urlopen

    namespace = "yaluk"
    secret_name = "rustfs-credentials"
    api = f"https://{os.environ['KUBERNETES_SERVICE_HOST']}:{os.environ.get('KUBERNETES_SERVICE_PORT_HTTPS', '443')}/api/v1/namespaces/{namespace}/secrets"
    token_path = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    ca_path = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    token = open(token_path, encoding="utf-8").read().strip()
    tls = ssl.create_default_context(cafile=ca_path)

    def call(method, url, payload=None):
        body = None if payload is None else json.dumps(payload).encode()
        request = Request(url, data=body, method=method, headers={
            "Authorization": f"Bearer {token}",
            "Accept": "application/json",
            "Content-Type": "application/json",
        })
        try:
            with urlopen(request, context=tls, timeout=10) as response:
                return response.status, response.read()
        except HTTPError as error:
            return error.code, error.read()

    def validate_existing():
        status, body = call("GET", f"{api}/{secret_name}")
        if status == 404:
            return False
        if status != 200:
            raise RuntimeError(f"Kubernetes API returned HTTP {status} while checking the credential Secret")
        data = json.loads(body).get("data", {})
        required = {"RUSTFS_ACCESS_KEY", "RUSTFS_SECRET_KEY"}
        if not required.issubset(data) or any(not data[key] for key in required):
            raise RuntimeError("Existing rustfs-credentials Secret is missing required keys")
        return True

    if validate_existing():
        print("RustFS credentials Secret already exists; preserving it.")
    else:
        access_key = secrets.token_hex(16)
        secret_key = secrets.token_hex(32)
        secret = {
            "apiVersion": "v1",
            "kind": "Secret",
            "metadata": {"name": secret_name, "namespace": namespace},
            "type": "Opaque",
            "data": {
                "RUSTFS_ACCESS_KEY": base64.b64encode(access_key.encode()).decode(),
                "RUSTFS_SECRET_KEY": base64.b64encode(secret_key.encode()).decode(),
            },
        }
        for attempt in range(12):
            try:
                status, _ = call("POST", api, secret)
                if status in (200, 201):
                    print("Generated and stored RustFS credentials in rustfs-credentials.")
                    break
                if status == 409 and validate_existing():
                    print("RustFS credentials Secret was created concurrently; preserving it.")
                    break
                raise RuntimeError(f"Kubernetes API returned HTTP {status} while creating the credential Secret")
            except URLError:
                if attempt == 11:
                    raise
                time.sleep(5)

---
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-secret-generator
  namespace: yaluk
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    spec:
      serviceAccountName: rustfs-secret-generator
      restartPolicy: Never
      containers:
        - name: generate-secret
          image: python:3.13-alpine
          command: ["python", "/scripts/generate-secret.py"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: rustfs-secret-generator
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rustfs-secret-generator
  namespace: yaluk
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        spec:
          serviceAccountName: rustfs-secret-generator
          restartPolicy: Never
          containers:
            - name: ensure-secret
              image: python:3.13-alpine
              command: ["python", "/scripts/generate-secret.py"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 10001
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: rustfs-secret-generator
