apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: postgres-pooler
  namespace: yaluk
spec:
  cluster:
    name: postgres
  instances: 3
  type: rw
  pgbouncer:
    poolMode: session
    parameters:
      max_client_conn: "1000"
      default_pool_size: "25"
  serviceTemplate:
    spec:
      type: NodePort
      ports:
        - name: pgbouncer
          port: 5432
          targetPort: 5432
          protocol: TCP
