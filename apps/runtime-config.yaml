apiVersion: v1
kind: ConfigMap
metadata:
  name: hydraflowsim-runtime-config
  namespace: hydraflowsim
data:
  PORT: "8000"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-kafka-bootstrap.hydraflowsim.svc.cluster.local:9092"
  ALL_REQUEST_TOPIC: "hydraflowsim.streaming.all-simulations"
  REQUEST_TOPIC: "hydraflowsim.streaming.simulations"
  RESULTS_TOPIC: "hydraflowsim.streaming.simulation-results"
  SIMULATION_STATUS_TOPIC: "hydraflowsim.streaming.simulation-status"
  CONSUMER_GROUP_ID: "sim-workers"
  S3_ENDPOINT_URL: "http://rustfs.hydraflowsim.svc.cluster.local:9000"
  S3_REQUESTS_BUCKET: "hydraflowsim-requests"
  S3_RESOURCES_BUCKET: "hydraflowsim-resources"
  S3_RESULTS_BUCKET: "hydraflowsim-results"
  DB_HOST: "postgres-pooler.hydraflowsim.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "app"
  SIMULATION_TABLE: "streaming.simulation"
  CONNECT_TABLE_ALL_SIMULATIONS: "app.streaming.all-simulations"
  CONNECT_TABLE_SIMULATIONS: "app.streaming.simulation"
  CONNECT_TABLE_SIMULATION_RESULTS: "app.streaming.simulation-results"
  CONNECT_TABLE_SIMULATION_STATUS: "app.streaming.all-simulations"
