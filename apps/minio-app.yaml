apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.min.io
    targetRevision: 5.4.0
    helm:
      parameters:
        - name: persistence.size
          value: 50Gi
        - name: replicas
          value: "2"
        - name: service.type
          value: NodePort
        - name: consoleService.type
          value: NodePort
        - name: buckets[0].name
          value: yaluk-requests
        - name: buckets[0].policy
          value: none
        - name: buckets[0].purge
          value: "false"
        - name: buckets[1].name
          value: yaluk-resources
        - name: buckets[1].policy
          value: none
        - name: buckets[1].purge
          value: "false"
        - name: buckets[2].name
          value: yaluk-results
        - name: buckets[2].policy
          value: none
        - name: buckets[2].purge
          value: "false"
    chart: minio
  destination:
    server: https://kubernetes.default.svc
    namespace: yaluk
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
