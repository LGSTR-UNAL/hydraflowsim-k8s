---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: yaluk
  name: yaluk
  namespace: yaluk
spec:
  replicas: 30
  selector:
    matchLabels:
      app: yaluk
  template:
    metadata:
      labels:
        app: yaluk
    spec:
      containers:
        - name: yaluk
          image: lgstrunal/yaluk:beta
          imagePullPolicy: Always
          command: ["/bin/sh"]
          args:
            - -c
            - >-
              python3 /opt/yaluk/bin/main.pyc
          resources:
            requests:
              cpu: "1"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "1536Mi"
          env:
            - name: TPBIG_PATH
              value: "/opt/yaluk/libatp/tpbig"
            - name: YALUK_PATH
              value: "/opt/yaluk/libatp"
            - name: KAFKA_HOST
              value: "kafka-kafka-bootstrap.yaluk.svc.cluster.local:9092"
            - name: REQUEST_TOPIC
              value: "yaluk.streaming.simulations"
            - name: RESULTS_TOPIC
              value: "yaluk.streaming.simulation-results"
            - name: SIMULATION_STATUS_TOPIC
              value: "yaluk.streaming.simulation-status"
            - name: CONSUMER_GROUP_ID
              value: "yaluk"
            - name: POSTGRES_HOST
              value: "postgres-pooler.yaluk.svc.cluster.local"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "app"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: password
            - name: S3_ENDPOINT_URL
              value: "http://minio.yaluk.svc.cluster.local:9000/"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio
                  key: rootUser
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio
                  key: rootPassword
            - name: OMP_NUM_THREADS
              value: "1"

      imagePullSecrets:
        - name: reg-cred
