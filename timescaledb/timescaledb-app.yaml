---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: timescaledb
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://charts.timescale.com'
    targetRevision: 0.33.1
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: podManagementPolicy
          value: Parallel
        - name: persistentVolumes.wal.size
          value: 30Gi
        - name: service.primary.type
          value: NodePort
        - name: persistentVolumes.data.size
          value: 100Gi
        - name: resources.limits.cpu
          value: 2500m
        - name: resources.limits.memory
          value: 6Gi
        - name: replicaCount
          value: '1'
        - name: patroni.bootstrap.dcs.postgresql.parameters.shared_buffers
          value: 2048MB
        - name: patroni.bootstrap.dcs.postgresql.parameters.effective_cache_size
          value: 4098MB
        - name: patroni.bootstrap.dcs.postgresql.parameters.maintenance_work_mem
          value: 265MB
        - name: patroni.bootstrap.dcs.postgresql.parameters.work_mem
          value: 64MB
        - name: patroni.bootstrap.dcs.postgresql.parameters.max_parallel_workers
          value: '4'
        - name: >-
            patroni.bootstrap.dcs.postgresql.parameters.max_parallel_workers_per_gather
          value: '2'
        - name: patroni.bootstrap.dcs.postgresql.parameters.autovacuum_max_workers
          value: '10'
        - name: patroni.bootstrap.dcs.postgresql.parameters.autovacuum_naptime
          value: '10'
        - name: patroni.bootstrap.dcs.postgresql.parameters.effective_io_concurrency
          value: '256'
        - name: patroni.bootstrap.dcs.postgresql.parameters.max_wal_size
          value: 4GB
        - name: patroni.bootstrap.dcs.postgresql.parameters.min_wal_size
          value: 512MB
        - name: patroni.bootstrap.dcs.postgresql.parameters.wal_buffers
          value: 16MB
        - name: image.tag
          value: pg16.3-ts2.15.2-all
    chart: timescaledb-single
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: databases

