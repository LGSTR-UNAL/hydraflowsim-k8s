---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: yaluk
  name: yaluk
  namespace: yaluk
spec:
  replicas: 15
  selector:
    matchLabels:
      app: yaluk
  template:
    metadata:
      labels:
        app: yaluk
    spec:
      containers:
        - name: yaluk
          image: lgstrunal/yaluk:0.1.0
          imagePullPolicy: Always
          command: ["/bin/sh"]
          args:
            - -c
            - >-
              python3 /opt/yaluk/bin/main.pyc
          env:
            - name: TPBIG_PATH
              value: "/opt/yaluk/libatp/tpbig"
            - name: YALUK_PATH
              value: "/opt/yaluk/libatp"
            - name: KAFKA_HOST
              value: "kafka-kafka-bootstrap.yaluk.svc.cluster.local:9092"
            - name: REQUEST_TOPIC
              value: "yaluk.streaming.simulations"
            - name: RESULTS_TOPIC
              value: "yaluk.streaming.simulation-results"
            - name: CONSUMER_GROUP_ID
              value: "yaluk"
            - name: POSTGRES_HOST
              value: "postgres-pooler.yaluk.svc.cluster.local"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "app"
            - name: POSTGRES_USER
              value: "app"
            - name: POSTGRES_PASSWORD
              value: "boJB1dal41Hm1BdWruZMbM5ZLNRuJSfaG8eCNSvoBYNwUQOa4TfPSO4XAO2l4HsX"
            - name: S3_ENDPOINT_URL
              value: "http://minio.yaluk.svc.cluster.local:9000/"
            - name: AWS_ACCESS_KEY_ID
              value: "s73Lm8Xjs94InpaxkFTx"
            - name: AWS_SECRET_ACCESS_KEY
              value: "SmPKWyAf7FuitlwMlq3zQpSzmWkx86IHpFZCs46R"

      imagePullSecrets:
        - name: reg-cred
