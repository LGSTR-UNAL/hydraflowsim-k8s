---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: sim-workers
  name: sim-workers
  namespace: hydraflowsim
spec:
  # Replica count is managed by KEDA/HPA (see sim-workers-scaledobject.yaml).
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: sim-workers
  template:
    metadata:
      labels:
        app: sim-workers
    spec:
      terminationGracePeriodSeconds: 180
      containers:
        - name: sim-workers
          # Build and push the worker image from your software source, then replace this placeholder.
          image: registry.example.com/your-project/sim-workers:1.0.0
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "0.5"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "1536Mi"
          env:
            - name: SIMULATOR_EXECUTABLE
              value: "/opt/simulator/bin/simulator"
            - name: SIMULATOR_HOME
              value: "/opt/simulator"
            - name: KAFKA_HOST
              value: "kafka-kafka-bootstrap.hydraflowsim.svc.cluster.local:9092"
            - name: REQUEST_TOPIC
              value: "hydraflowsim.streaming.simulations"
            - name: RESULTS_TOPIC
              value: "hydraflowsim.streaming.simulation-results"
            - name: SIMULATION_STATUS_TOPIC
              value: "hydraflowsim.streaming.simulation-status"
            - name: CONSUMER_GROUP_ID
              value: "sim-workers"
            - name: POSTGRES_HOST
              value: "postgres-pooler.hydraflowsim.svc.cluster.local"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "app"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: password
            - name: S3_ENDPOINT_URL
              value: "http://rustfs.hydraflowsim.svc.cluster.local:9000/"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: RUSTFS_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: RUSTFS_SECRET_KEY
            - name: OMP_NUM_THREADS
              value: "1"

      imagePullSecrets:
        - name: reg-cred
