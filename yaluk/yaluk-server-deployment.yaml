---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: yaluk-server
  name: yaluk-server
  namespace: yaluk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yaluk-server
  template:
    metadata:
      labels:
        app: yaluk-server
    spec:
      containers:
        - name: yaluk-server
          image: lgstrunal/yaluk-server:0.0.1
          imagePullPolicy: Always
          ports:
            - name: yk-port
              containerPort: 8000
              protocol: TCP
          workingDir: /opt/server
          command: ["uvicorn"]
          args:
            [
              "main:app",
              "--host",
              "0.0.0.0",
              "--port",
              "8000",
              "--workers",
              "1",
            ]
          env:
            - name: SOLVER_PATH
              value: "/opt/yaluk/libatp/tpbig"
            - name: ALL_REQUEST_TOPIC
              value: "yaluk.streaming.all-requests"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-kafka-bootstrap.yaluk.svc.cluster.local:9092"
            - name: REQUEST_TOPIC
              value: "yaluk.streaming.simulations"
            - name: S3_ENDPOINT_URL
              value: "http://minio.yaluk.svc.cluster.local:9000/"
            - name: AWS_ACCESS_KEY_ID
              value: "SclERI932kuy0vlVbPCq"
            - name: AWS_SECRET_ACCESS_KEY
              value: "EddRb6gQWONO49ALEcRtaMQDTCCiyI8QlGN3D8u5"
      imagePullSecrets:
        - name: reg-cred
