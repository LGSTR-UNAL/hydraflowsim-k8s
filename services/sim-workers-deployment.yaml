---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: sim-workers
  name: sim-workers
  namespace: hydraflowsim
spec:
  # Replica count is managed by KEDA/HPA (see sim-workers-scaledobject.yaml).
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: sim-workers
  template:
    metadata:
      labels:
        app: sim-workers
    spec:
      terminationGracePeriodSeconds: 600
      containers:
        - name: sim-workers
          # Build and push the worker image from your software source, then replace this placeholder.
          image: registry.example.com/your-project/sim-workers:1.0.0
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "0.5"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "1536Mi"
          env:
            - name: SIMULATOR_EXECUTABLE
              value: "/opt/simulator/bin/simulator"
            - name: SIMULATOR_HOME
              value: "/opt/simulator"
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: RUSTFS_ACCESS_KEY
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: RUSTFS_SECRET_KEY
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: password
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: RUSTFS_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: RUSTFS_SECRET_KEY
            - name: OMP_NUM_THREADS
              value: "1"
          envFrom:
            - configMapRef:
                name: hydraflowsim-runtime-config

      imagePullSecrets:
        - name: reg-cred
